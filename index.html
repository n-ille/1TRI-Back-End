<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro de Clientes</title>
    <script>
        function pesquisarCep(){

            erro.textContent = ""
            document.getElementById("rua").value = ""
            document.getElementById("bairro").value = ""
            document.getElementById("cidade").value = ""
            document.getElementById("uf").value = ""

            var validacep = /^[0-9]{8}$/
            const cep = document.getElementById("cep").value 
            
            if(validacep.test(cep)){
               const link = "https://viacep.com.br/ws/" + cep +"/json/?callback=preencherEndereco"
               var script = document.createElement ("script")
               script.src = link
               document.body.appendChild(script) 
        
            } else {
                erro.textContent = "O CEP digitado não existe!"
                document.getElementBiId("cep").value = ""
            }

        }

        function preencherEndereco(conteudo){
          if (!("erro" in conteudo)){
            document.getElementById("rua").value = conteudo.logradouro
            document.getElementById("bairro").value = conteudo.bairro
            document.getElementById("cidade").value = conteudo.localidade
            document.getElementById("uf").value = conteudo.uf
          } else {
            erro.textContent = "O CEP digitado não existe!"
          }
        }

    </script>
</head>
<body>
    <h1>Cadastro de clientes</h1>
    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome aqui" required>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="priquitosempena@gmail.com" required>
        <label for="celular">Celular:</label>
        <input type="tel" id="celular" placeholder="(42) 91234-5678" required>
        <label for="cpf">Cpf:</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" required>
        <label for="cep">CEP:</label>
        <input type="text" id="cep" onblur="pesquisarCep()" name="cep" placeholder="00000-000" required>
        <p id = "erro"></p>
        <label for="rua">Rua:</label>
        <input type="text" id="rua" placeholder="Rua Priquito Sem Pena" required>
        <label for="número">Número:</label>
        <input type="text" id="numero" placeholder="769" required>
        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" placeholder="Bairro Priquito Com Pena" required>
        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" placeholder="Priquito Com Pena Grossa" required>
        <label for="uf">UF:</label>
        <input type="text" id="uf" placeholder="Priquito Com Pena Fina" required>
        <label for="senha">Senha:</label>
        <input type="text" id="senha" placeholder="priquitosempena123" required>

        <input type="submit" value="Enviar Cadastro">
        </form>
</body>
</html>
